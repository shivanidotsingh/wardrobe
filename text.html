<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>summer wardrobe</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    background:#eaeaea;
    font-family: Arial, Helvetica, sans-serif;
    overflow:hidden;
  }

  .toggle-btn{
    position:fixed;
    top:12px;
    right:12px;
    padding:6px 12px;
    background:#fff;
    border:1px solid #999;
    font-size:11px;
    cursor:pointer;
    z-index:1000;
  }

  /* ---------- POSTER VIEW ---------- */
  .poster-view{ display:none; }
  .poster-view.active{ display:block; }

  .fit{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* composed inside a fixed 1150 x 1050 canvas, then scaled to fit */
  .canvas{
    position:relative;
    width:1150px;
    height:1050px;
    flex:none;
    transform-origin:center center;
    user-select:none;
  }

  .type{ position:absolute; inset:0; z-index:1; }

  .type i{
    position:absolute;
    display:block;
    font-family:'Instrument Serif', Georgia, serif;
    font-style:normal;
    font-weight:400;
    line-height:.78;
    letter-spacing:-.015em;
    white-space:nowrap;
    -webkit-text-stroke:1.6px #111;
    visibility:hidden;
  }
  .type i.on{ visibility:visible; }
  .type i.it{ font-style:italic; }

  .figure{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    z-index:2;
    max-height:1010px;
    width:auto;
    display:block;
  }

  /* press g — dashed box is the figure, tinted bands are the channels */
  .guide{ position:absolute; inset:0; z-index:3; display:none; pointer-events:none; }
  .guide.on{ display:block; }
  .guide .fig{
    position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    height:1010px; width:420px; border:2px dashed rgba(0,0,0,.4);
  }
  .guide .ch{ position:absolute; top:0; bottom:0; background:rgba(0,120,255,.07); }
  .guide .chL{ left:20px; width:340px; }
  .guide .chR{ left:800px; width:330px; }

  .zone{
    position:fixed;
    top:0;
    bottom:0;
    width:24%;
    z-index:900;
    cursor:pointer;
  }
  .zone.prev{ left:0; }
  .zone.next{ right:0; }

  .hint{
    position:fixed;
    left:12px;
    bottom:10px;
    font-size:10px;
    opacity:.45;
    z-index:1000;
  }

  /* ---------- GRID VIEW ---------- */
  .grid-view{
    display:none;
    overflow-y:auto;
    height:100vh;
    padding:48px;
    box-sizing:border-box;
  }
  .grid-view.active{ display:block; }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:48px;
  }
  .item{ text-align:center; }
  .item img{
    max-width:90%;
    height:auto;
    display:block;
    margin:0 auto;
    cursor:pointer;
  }
  .item .caption{
    margin-top:6px;
    font-size:11px;
    line-height:1.2;
  }

  @media (max-width: 900px){
    .grid{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width: 500px){
    .grid{ grid-template-columns:1fr; }
  }
</style>
</head>

<body>

<button class="toggle-btn" id="toggleBtn">view as grid</button>

<!-- POSTER VIEW -->
<div class="poster-view active" id="posterView">
  <div class="fit">
    <div class="canvas" id="canvas">
      <div class="type" id="type"></div>
      <img class="figure" id="figure" alt="">
      <div class="guide" id="guide">
        <div class="ch chL"></div>
        <div class="ch chR"></div>
        <div class="fig"></div>
      </div>
    </div>
  </div>
  <div class="zone prev" id="zPrev"></div>
  <div class="zone next" id="zNext"></div>
  <div class="hint">shivi's summer wardrobe</div>
</div>

<!-- GRID VIEW -->
<div class="grid-view" id="gridView">
  <div class="grid" id="gridContainer"></div>
</div>

<script>
/* ---------------------------------------------------------------
   Canvas is 1150 x 1050. The figure is ~420 wide and centred,
   so it sits at x 365-785.

       LEFT CHANNEL    x 20-360
       RIGHT CHANNEL   x 800-1130

   READING PATH - every poster runs the same way:
       y  70-110   opening words, small, top left
       y 110-290   first hero, top left, running right
       y 300-560   the middle bits
       y 700-760   final hero, over on the right

   THREE TIERS
   small   26-44   the, of, in, at, and - connectives.
   mid     90-170  secondary content words.
   hero   170-210  the word the poster is about.

   Rough width: chars x 0.42 x fontSize. Keep x + width under 1130.

   line = [text, fontSize, x, y, rotation, italic?]
   Lines reveal in array order, so keep them in sentence order.
----------------------------------------------------------------*/
const items = [

      ["pockets", 110, 800, 700, -2, 1]
    ]
  },
  {

      ["richa said", 30, 940, 520, -2],
      ["her mom also", 30, 930, 558, -2],
      ["owned", 150, 800, 700, -8, 1]
    ]
  },
  {
    src: "that family photo dress.png",
    caption: "that family photo dress.",
    color: "#4a63c8",
    lines: [
      ["that", 30, 20, 70, -3],
      ["family", 200, 40, 125, 2],

    ]
  },
  {
    src: "that kutch trip skirt.png",
    caption: "that kutch trip skirt.",
    color: "#b2382f",
    lines: [
      ["that", 30, 20, 70, -3],
      ["kutch", 200, 40, 125, 2],
      ["trip", 200, 40, 280, 2],
      ["skirt", 150, 800, 500, -7, 1]
    ]
  },
  {
    src: "that cream top.png",
    caption: "the linen top I wore last summer in France.",
    color: "#8fb3d9",
    lines: [
      ["the linen top I wore", 30, 20, 70, -2.5],

    ]
  },
  {

    color: "#e5b032",

      ["dress", 150, 800, 700, 1.5, 1]
    ]
  },
  {

    caption: "the dress I have worn out.",
    color: "#41639b",
    lines: [
      ["the dress I have", 30, 20, 70, -2.5],

    ]

  },
  {

    color: "#3b4f96",

      ["was visiting", 70, 790, 560, 1.5, 1]

  },
  {

    color: "#e08a95",

      ["at the", 30, 20, 110, -2.5],
      ["nh7", 200, 40, 170, 2],

  },
  {
    src: "that denim skirt.png",
    caption: "that denim skirt I wore to karaoke in valence.",
    color: "#6288ad",
    lines: [
      ["that denim skirt", 30, 20, 70, -2.5],
      ["I wore to", 30, 20, 110, -2.5],

      ["in", 130, 20, 300, 1.5],
      ["valence", 130, 20, 420, 1.5, 1]
    ]
  },
  {
    src: "that diwali dress.png",
    caption: "that second-hand diwali dress from indiska.",
    color: "#a4523c",
    lines: [
      ["that second-hand", 30, 20, 70, -3],
      ["diwali", 200, 40, 125, 2],
      ["dress", 160, 20, 340, -2],
      ["from", 44, 880, 330, 1.5],
      ["indiska", 130, 740, 430, -4, 1]
    ]
  },
  {
    src: "that monsoon dress.png",
    caption: "the dress that reminds me of mumbai monsoons.",
    color: "#2f63b5",
    lines: [
      ["the dress that", 30, 20, 70, -2.5],
      ["reminds me of", 30, 20, 110, -2.5],
      ["mumbai", 190, 40, 170, 2],
      ["mon-", 180, 700, 470, -3, 1],
      ["soons", 180, 640, 690, -3, 1]
    ]
  },
  {
    src: "that pink floral top.png",
    caption: "that top I wore to lunch with Shruthi at that vietnamese pho place.",
    color: "#df6b80",
    lines: [
      ["that top I wore to", 30, 20, 70, -2.5],
      ["lunch", 190, 40, 125, 2],
      ["with", 170, 700, 330, -3],
      ["shruthi", 190, 560, 620, -2.5, 1],
      ["at that vietnamese", 30, 880, 800, -2],
      ["pho place", 30, 880, 836, -2]
    ]
  }
];

const CW = 1150, CH = 1050;

let i = 0;
let viewMode = 'poster';
let timers = [];

const canvas = document.getElementById('canvas');
const typeEl = document.getElementById('type');
const figure = document.getElementById('figure');
const toggleBtn = document.getElementById('toggleBtn');
const posterView = document.getElementById('posterView');
const gridView = document.getElementById('gridView');
const gridContainer = document.getElementById('gridContainer');

function idx(n){
  const L = items.length;
  return (n % L + L) % L;
}

function fitCanvas(){
  const pad = window.innerWidth < 700 ? 0 : 24;
  const s = Math.min(
    (window.innerWidth  - pad) / CW,
    (window.innerHeight - pad) / CH
  );
  canvas.style.transform = 'scale(' + s + ')';
}

function renderPoster(){
  timers.forEach(clearTimeout);
  timers = [];

  const it = items[idx(i)];

  figure.src = it.src;
  figure.alt = it.caption;

  typeEl.innerHTML = '';
  const nodes = it.lines.map(function(l){
    const el = document.createElement('i');
    el.textContent = l[0];
    el.style.fontSize  = l[1] + 'px';
    el.style.left      = l[2] + 'px';
    el.style.top       = l[3] + 'px';
    el.style.transform = 'rotate(' + l[4] + 'deg)';
    el.style.color     = it.color;
    if (l[5]) el.classList.add('it');
    typeEl.appendChild(el);
    return el;
  });

  /* pieces land whole, in sentence order, on slightly uneven beats */
  const BEAT = 210;
  nodes.forEach(function(node, n){
    const jitter = (n % 2 ? 0.85 : 1.15);
    timers.push(setTimeout(function(){
      node.classList.add('on');
    }, Math.round(BEAT * n * jitter) + 140));
  });
}

function go(delta){
  i = idx(i + delta);
  renderPoster();
}

function renderGrid(){
  gridContainer.innerHTML = '';
  items.forEach(function(item, n){
    const div = document.createElement('div');
    div.className = 'item';

    const img = document.createElement('img');
    img.src = item.src;
    img.alt = item.caption || '';
    img.addEventListener('click', function(){
      i = n;
      toggleView();
    });

    const caption = document.createElement('div');
    caption.className = 'caption';
    caption.textContent = item.caption || '';

    div.appendChild(img);
    div.appendChild(caption);
    gridContainer.appendChild(div);
  });
}

function toggleView(){
  if (viewMode === 'poster'){
    viewMode = 'grid';
    posterView.classList.remove('active');
    gridView.classList.add('active');
    toggleBtn.textContent = 'view as posters';
    document.body.style.overflow = 'auto';
    if (gridContainer.children.length === 0) renderGrid();
  } else {
    viewMode = 'poster';
    gridView.classList.remove('active');
    posterView.classList.add('active');
    toggleBtn.textContent = 'view as grid';
    document.body.style.overflow = 'hidden';
    fitCanvas();
    renderPoster();
  }
}

toggleBtn.addEventListener('click', toggleView);
document.getElementById('zPrev').addEventListener('click', function(){ go(-1); });
document.getElementById('zNext').addEventListener('click', function(){ go(1); });

window.addEventListener('keydown', function(e){
  if (e.key === 'g' || e.key === 'G'){
    document.getElementById('guide').classList.toggle('on');
    return;
  }
  if (viewMode !== 'poster') return;
  if (e.key === 'ArrowLeft')  go(-1);
  if (e.key === 'ArrowRight') go(1);
});

let wheelLock = false;
window.addEventListener('wheel', function(e){
  if (viewMode !== 'poster') return;
  if (wheelLock) return;
  wheelLock = true;
  setTimeout(function(){ wheelLock = false; }, 300);
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (d > 0) go(1);
  if (d < 0) go(-1);
}, { passive: true });

let touchX = 0;
window.addEventListener('touchstart', function(e){
  touchX = e.changedTouches[0].screenX;
}, { passive: true });
window.addEventListener('touchend', function(e){
  if (viewMode !== 'poster') return;
  const diff = touchX - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 50) go(diff > 0 ? 1 : -1);
}, { passive: true });

window.addEventListener('resize', fitCanvas);

fitCanvas();
renderPoster();
</script>
</body>
</html>
